<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>BoomTimer</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header class="drag">
    <div class="brand">💣 BoomTimer</div>
    <div class="sub">时间一到，屏幕炸给你看</div>
  </header>

  <div id="perm" class="banner hidden">
    <div>想要<b>整块屏幕真实抖动</b>？需要开启「屏幕录制」权限。</div>
    <div class="banner-actions">
      <button id="perm-btn" class="link">去开启 →</button>
      <button id="restart-btn" class="link dim">已授权但提示还在？重启应用</button>
    </div>
    <div class="hint">未开启也能炸，只是抖动会以浮层形式呈现。授权后本提示通常几秒内自动消失。</div>
  </div>

  <main>
    <div class="dial">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="88" />
        <circle id="prog" class="prog" cx="100" cy="100" r="88" />
      </svg>
      <div class="dial-center">
        <div id="clock">45:00</div>
        <div id="status">未开始</div>
      </div>
    </div>

    <div class="presets" id="presets">
      <button data-min="15">15 分</button>
      <button data-min="25">25 分</button>
      <button data-min="45">45 分</button>
      <button data-min="60">60 分</button>
    </div>

    <div class="custom">
      <label for="min">自定义</label>
      <input id="min" type="number" min="0.1" max="600" step="1" value="45" />
      <span>分钟</span>
    </div>

    <div class="actions">
      <button id="toggle" class="primary">开始</button>
      <button id="reset">重置</button>
      <button id="boom" class="danger">💥 试炸</button>
    </div>

    <section class="settings">
      <div class="row">
        <span>爆完自动重新计时</span>
        <label class="switch"><input type="checkbox" id="loop" /><i></i></label>
      </div>
      <div class="row">
        <span>爆炸音效</span>
        <label class="switch"><input type="checkbox" id="sound" /><i></i></label>
      </div>
      <div class="row">
        <span>音量</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" />
      </div>
      <div class="row">
        <span>炸弹飞来（0.9 秒引线）</span>
        <label class="switch"><input type="checkbox" id="fuse" /><i></i></label>
      </div>
      <div class="row">
        <span>多显示器同时炸<br><small style="color:#5c6675">开启会让主屏帧率略降</small></span>
        <label class="switch"><input type="checkbox" id="allScreens" /><i></i></label>
      </div>
      <div class="row col">
        <span>爆炸强度</span>
        <div class="seg" id="intensity">
          <button data-v="gentle">温柔</button>
          <button data-v="normal">标准</button>
          <button data-v="nuke">毁灭</button>
        </div>
      </div>
    </section>

    <p class="foot">关闭窗口不会退出，倒计时在托盘继续跑。</p>
  </main>

  <script src="bridge.js"></script>
  <script src="sound.js"></script>
  <script src="index.js"></script>
</body>
</html>
