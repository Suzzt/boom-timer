<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>boom preview</title>
  <link rel="stylesheet" href="boom.css" />
  <style>
    body { background: #12151b; }
    /* 预览时固定舞台尺寸，避免面板缩放干扰截图 */
    #stage { inset: auto; left: 0; top: 0; width: 1280px; height: 720px; }
    #fakedesk { width: 1280px; height: 720px; inset: auto; left: 0; top: 0; }
    #fakedesk {
      position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(135deg, #2b3a55 0%, #1b2233 100%);
      font-family: -apple-system, "PingFang SC", sans-serif;
      color: #cfd8e6; padding: 60px; font-size: 15px; line-height: 2;
    }
    #bar { position:absolute; inset:0 0 auto 0; height:34px; background:#0f141d; }
  </style>
</head>
<body>
  <div id="fakedesk">
    <div id="bar"></div>
    <div style="margin-top:40px">
      <b style="font-size:22px">季度复盘.docx</b><br>
      2026 Q3 目标达成情况分析<br>
      · 渠道 A 转化率同比提升 12%<br>
      · 渠道 B 投放 ROI 待优化<br>
      · 下一步：重排预算模型，补齐留存看板<br>
      ————————————————<br>
      TODO: 周五前给到王总初稿
    </div>
  </div>
  <div id="stage">
    <img id="shot" alt="" />
    <div id="dim"></div>
    <canvas id="fx"></canvas>
    <canvas id="hole"></canvas>
    <div id="flash"></div>
    <div id="msg"><div id="msg-emoji">💥</div><div id="msg-text"></div></div>
  </div>
  <script>
    // 用一张 SVG 假桌面当作「屏幕快照」，模拟真实运行时的震动素材
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2b3a55"/><stop offset="1" stop-color="#1b2233"/>
      </linearGradient></defs>
      <rect width="1280" height="800" fill="url(#g)"/>
      <rect width="1280" height="34" fill="#0f141d"/>
      <g fill="#cfd8e6" font-family="sans-serif">
        <text x="60" y="140" font-size="30" font-weight="bold">季度复盘.docx</text>
        <text x="60" y="196" font-size="19">2026 Q3 目标达成情况分析</text>
        <text x="60" y="236" font-size="19">· 渠道 A 转化率同比提升 12%</text>
        <text x="60" y="276" font-size="19">· 渠道 B 投放 ROI 待优化</text>
        <text x="60" y="316" font-size="19">· 下一步：重排预算模型，补齐留存看板</text>
        <text x="60" y="380" font-size="19">TODO: 周五前给到王总初稿</text>
      </g>
    </svg>`;
    const shot = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

    const q = new URLSearchParams(location.search);
    // 调试：?slow=K 把动画时间轴放慢 K 倍，方便逐帧截图检查
    const slow = parseFloat(q.get('slow') || '1');
    if (slow > 1) {
      const raf = window.requestAnimationFrame.bind(window);
      let base = null;
      window.requestAnimationFrame = (cb) => raf((t) => {
        if (base === null) base = t;
        cb(base + (t - base) / slow);
      });
    }

    // 调试：?manual=1 手动驱动时间轴，配合 window.__seek(ms) 逐帧截图
    if (q.get('manual')) {
      let queue = [];
      window.requestAnimationFrame = (cb) => { queue.push(cb); return queue.length; };
      // Tauri 版的初始化是异步的（要等截图解码 + 两帧预热），
      // 所以先把预热阶段排队的回调抽干，再开始推进时间轴。
      window.__seek = async (T) => {
        for (let i = 0; i < 8; i++) {
          const q2 = queue; queue = [];
          q2.forEach((cb) => cb(0));
          await new Promise((r) => setTimeout(r, 0));
        }
        let t = 0;
        let delivered = false;
        while (t <= T) {
          if (!queue.length) break;
          const q2 = queue; queue = [];
          q2.forEach((cb) => cb(t));
          t += 16.6;
          await Promise.resolve();
          // 动画跑起来之后才送截图 —— 渲染层有「t0 未初始化就丢弃」的守卫，
          // 而真实运行时截图也确实是在动画开跑约 0.4 秒后才到达的
          if (!delivered && t > 50 && shotDeliver) {
            delivered = true;
            shotDeliver(shot);
            await new Promise((r) => setTimeout(r, 80));
          }
        }
      };
    }

    let initCbs = [];
    let shotDeliver = null;
    let holeDismissCb = null;
    const kickoff = () => window.api.__kick();
    window.api = {
      // 两个模式各自注册，按 ?mode= 只喂给对应的那个
      onBoomInit: (cb) => { initCbs.push(cb); setTimeout(kickoff, 0); },
      __kick: () => {
        (q.get('manual') ? ((f) => f()) : ((f) => setTimeout(f, 60)))(() => initCbs.forEach((cb) => cb({
          mode: q.get('mode') || 'boom',
          shotPending: !q.get('noshot'),
          intensity: q.get('i') || 'normal',
          sound: false, volume: 0.7,
          fuse: q.get('fuse') !== '0',
          text: '起来动一动！',
          primary: true,
        })));
      },
      holeArmed: () => {},
      holeDismiss: () => { if (holeDismissCb) holeDismissCb(); },
      onHoleDismiss: (cb) => { holeDismissCb = cb; },
      boomDone: () => { document.title = 'done'; },
      playSound: () => {},
      log: () => {},
      // 模拟真实时序：截图在动画开跑之后才送达
      onBoomShot: (cb) => {
        if (q.get('noshot')) return;
        shotDeliver = cb;
        // 非定格模式下按真实时序补送：实测抓屏 0.4~0.7 秒
        if (!q.get('manual')) setTimeout(() => cb(shot), Number(q.get('shotdelay') || 450));
      },
    };
  </script>
  <script src="boom.js"></script>
  <script src="hole.js"></script>
  <script>
    // 把当前这一帧合成成一张完整图片存到 assets/（画布 + 仍可见的 DOM 截图层 + 文案）
    window.__export = async (name, w = 1040, h = 585) => {
      const big = document.createElement('canvas');
      big.width = 1280; big.height = 720;
      const c = big.getContext('2d');
      // 飞入阶段浮层是全透明的，用户看到的是自己的实时桌面 ——
      // 导出时把桌面画成底，才还原真实观感（而不是一片白）
      const shot = document.getElementById('shot');
      if (shot && shot.src && shot.complete && shot.naturalWidth) {
        c.drawImage(shot, 0, 0, 1280, 720);
      }
      for (const id of ['fx', 'hole']) {
        const cv = document.getElementById(id);
        if (!cv || cv.tagName !== 'CANVAS') continue;
        if (getComputedStyle(cv).display === 'none') continue;
        // 黑洞模式的「实底」是画布的 CSS 背景色，导图时要一并还原
        const bg = getComputedStyle(cv).backgroundColor;
        if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
          c.fillStyle = bg;
          c.fillRect(0, 0, 1280, 720);
        }
        c.drawImage(cv, 0, 0, 1280, 720);
      }
      const msg = document.getElementById('msg');
      const op = parseFloat(msg.style.opacity || '0');
      if (op > 0.05) {
        c.save();
        c.globalAlpha = Math.min(1, op);
        c.textAlign = 'center';
        c.shadowColor = 'rgba(255,110,20,.95)';
        c.shadowBlur = 26;
        c.font = '92px "Apple Color Emoji", sans-serif';
        c.fillText('💥', 640, 330);
        c.font = '800 40px -apple-system, "PingFang SC", sans-serif';
        c.fillStyle = '#fff';
        c.fillText(document.getElementById('msg-text').textContent || '', 640, 412);
        c.restore();
      }
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const oc = out.getContext('2d');
      oc.imageSmoothingQuality = 'high';
      oc.drawImage(big, 0, 0, w, h);
      await fetch('/save?name=' + encodeURIComponent(name), {
        method: 'POST', body: out.toDataURL('image/png'),
      });
      document.title = 'saved:' + name;
    };
  </script>
  <script>
    // ?at=ms 页面加载后自动跳到指定时刻并停住，方便截图
    if (q.get('manual') && q.get('at')) {
      const im = document.getElementById('shot');
      const go = () => setTimeout(async () => {
        await window.__seek(Number(q.get('at')));
        // ?save=名字 —— 定格后先把这一帧导出成图片（要在冻结画布之前做）
        if (q.get('save')) await window.__export(q.get('save'));
        // 冻结这一帧：把 canvas 换成静态图，避免截图时的 resize 把画面清空
        const c = document.getElementById('fx');
        const frozen = new Image();
        frozen.src = c.toDataURL();
        frozen.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
        c.replaceWith(frozen);
      }, 900);
      if (!im.src || im.complete) go(); else im.onload = go;
    }
  </script>
</body>
</html>
